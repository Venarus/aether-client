plugins {
    id 'java'
    id 'java-library'
}

group = 'com.aether'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

def isWindows = System.getProperty('os.name', '').toLowerCase().contains('windows')
def forgeLibDir = System.getenv('FORGE_LIBS_DIR') ?: (isWindows ? 'C:/Users/senem/curseforge/minecraft/Install/libraries' : '/tmp/curseforge/libraries')
def forgeBase = file(forgeLibDir)

def candidatePaths = [
    'net/minecraftforge/forge/1.21.10-60.1.18/forge-1.21.10-60.1.18-client.jar',
    'net/minecraftforge/forge/1.21.10-60.1.18/forge-1.21.10-60.1.18-universal.jar',
    'net/minecraftforge/fmlcore/1.21.10-60.1.18/fmlcore-1.21.10-60.1.18.jar',
    'net/minecraftforge/fmlloader/1.21.10-60.1.18/fmlloader-1.21.10-60.1.18.jar',
    'net/minecraftforge/javafmllanguage/1.21.10-60.1.18/javafmllanguage-1.21.10-60.1.18.jar',
    'net/minecraftforge/eventbus/7.0.6/eventbus-7.0.6.jar',
    'org/joml/joml/1.10.8/joml-1.10.8.jar',
    'com/mojang/datafixerupper/8.0.16/datafixerupper-8.0.16.jar',
    'com/mojang/brigadier/1.1.8/brigadier-1.1.8.jar'
]

def existingForgeJars = candidatePaths.collect { new File(forgeBase, it) }.findAll { it.exists() }
def hasForge = !existingForgeJars.isEmpty()

def mcForgeJars = files(existingForgeJars)
def localLibs = fileTree(dir: 'libs', include: ['*.jar'])

dependencies {
    if (hasForge) {
        compileOnly mcForgeJars
        testImplementation mcForgeJars
    } else {
        compileOnly localLibs
        testImplementation localLibs
    }

    implementation 'com.google.code.gson:gson:2.11.0'
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Testing Framework
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

if (!hasForge) {
    compileJava.enabled = false
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.named('jar', Jar) {
    archiveBaseName.set('aether-client')
    archiveVersion.set('1.0.0')
    archiveClassifier.set('')

    reproducibleFileOrder = true
    preserveFileTimestamps = false
    entryCompression = ZipEntryCompression.DEFLATED

    manifest {
        attributes([
            'Specification-Title'     : 'aetherclient',
            'Specification-Vendor'    : 'Aether Development Team',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'aetherclient',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Aether',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'FMLModType'              : 'MOD',
            'Automatic-Module-Name'   : 'com.aether.client'
        ])
    }

    doFirst {
        if (!hasForge && file('libs/aether-client-1.0.0.jar').exists()) {
            from(zipTree('libs/aether-client-1.0.0.jar'))
        }
    }
}

tasks.register('verifyJar') {
    dependsOn tasks.named('jar')
    doLast {
        File jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("JAR file does not exist: " + jarFile.getAbsolutePath())
        }
        println("=== JAR VERIFICATION SUCCESSFUL ===")
        println("File: " + jarFile.getAbsolutePath())
        println("Size: " + jarFile.length() + " bytes")
        println("===================================")
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyJar')
}
